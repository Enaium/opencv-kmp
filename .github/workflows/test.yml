name: Test

"on":
  workflow_dispatch:

# Publish-only CI: each runner builds and publishes the artifacts for its
# platform to the local Maven repository. No tests, no examples, no
# simulator runs are executed here - those run separately.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.logging.level=info"
  CVK_VERBOSE: "1"

jobs:
  publish-macos:
    name: Publish macOS platforms to Maven Local
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Record OpenCV submodule revision
        id: opencv-rev
        run: echo "sha=$(git -C opencv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            opencv-kmp/build/cmake-*
            opencv-kmp/build/native/*
            jni/jvm/*/build/cmake-jni/*
            jni/jvm/*/build/jni-native/*
          key: native-${{ runner.os }}-${{ steps.opencv-rev.outputs.sha }}-${{ hashFiles('native/**', 'jni/**', 'buildSrc/src/**', 'opencv-kmp/build.gradle.kts', 'opencv-kmp/src/nativeInterop/**') }}

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish macOS platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :opencv-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :opencv-kmp:publishJvmPublicationToMavenLocal
          :opencv-kmp:publishMacosArm64PublicationToMavenLocal
          :opencv-kmp:publishMacosX64PublicationToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

  publish-linux:
    name: Publish Linux + mingw platforms to Maven Local
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            libgtk-3-dev pkg-config

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Record OpenCV submodule revision
        id: opencv-rev
        run: echo "sha=$(git -C opencv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            opencv-kmp/build/cmake-*
            opencv-kmp/build/native/*
            jni/jvm/*/build/cmake-jni/*
            jni/jvm/*/build/jni-native/*
          key: native-${{ runner.os }}-${{ steps.opencv-rev.outputs.sha }}-${{ hashFiles('native/**', 'jni/**', 'buildSrc/src/**', 'opencv-kmp/build.gradle.kts', 'opencv-kmp/src/nativeInterop/**') }}

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish Linux + mingw platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :opencv-kmp:publishLinuxX64PublicationToMavenLocal
          :opencv-kmp:publishLinuxArm64PublicationToMavenLocal
          :opencv-kmp:publishMingwX64PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

  publish-windows:
    name: Publish Windows + JNI to Maven Local
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Build the windows-x86_64 JNI artifact
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          :jni-jvm-windows-x86_64:buildJniLibrarywindows-x86_64

      - name: Decode signing key
        shell: pwsh
        run: |
          $tmp = [System.IO.Path]::GetTempFileName()
          $env:RUNNER_TEMP = $tmp
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing-key.gpg", $bytes)

      - name: Publish Windows + JNI to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :opencv-kmp:publishJvmPublicationToMavenLocal
          :opencv-kmp:publishMingwX64PublicationToMavenLocal
          :jni-jvm-windows-x86_64:publishToMavenLocal

  publish-android:
    name: Publish Android to Maven Local
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish Android to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :opencv-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :opencv-kmp:publishAndroidPublicationToMavenLocal
          :opencv-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          :opencv-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          :opencv-kmp:publishAndroidNativeX64PublicationToMavenLocal
          :opencv-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-android-arm64-v8a:publishToMavenLocal
          :jni-jvm-android-armeabi-v7a:publishToMavenLocal
          :jni-jvm-android-x86_64:publishToMavenLocal
          :jni-jvm-android-x86:publishToMavenLocal
